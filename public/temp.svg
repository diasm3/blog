    <text x="210" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    
    <rect x="340" y="410" width="120" height="60" rx="10" fill="#F6FFED" stroke="#52C41A" stroke-width="2"/>
    <text x="400" y="445" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 2</text>
    <text x="400" y="465" font-family="Arial" font-size="12" text-anchor="middle" fill="#52C41A">Leader</text>
    
