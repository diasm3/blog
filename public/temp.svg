    <text x="430" y="780" font-family="Arial" font-size="12" text-anchor="middle" fill="#722ed1">Term 2</text>
    <text x="490" y="780" font-family="Arial" font-size="12" text-anchor="middle" fill="#f5222d">새 서비스</text>
    
    <!-- 복제 화살표 -->
