  <line x1="50" y1="710" x2="750" y2="710" stroke="#722ed1" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="860" x2="750" y2="860" stroke="#722ed1" stroke-width="1" stroke-dasharray="5,5"/>
  
