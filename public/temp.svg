  <rect x="50" y="540" width="700" height="450" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <text x="90" y="570" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#722ed1">2. 로그 복제 (Log Replication)</text>
  
