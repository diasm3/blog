    <text x="400" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#FA8C16">Candidate</text>
    
    <rect x="530" y="290" width="120" height="60" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
    <text x="590" y="325" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 3</text>
    <text x="590" y="345" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    
