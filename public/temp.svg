    <text x="150" y="1380" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Index: 1-4</text>
    <text x="150" y="1400" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">LastTerm: 2</text>
    <text x="250" y="1390" font-family="Arial" font-size="10" text-anchor="middle" fill="#f5222d">✓ 새 서비스 항목 있음</text>
    
    <rect x="500" y="1330" width="180" height="80" rx="5" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="590" y="1350" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Manager 3 로그</text>
    <line x1="500" y1="1360" x2="680" y2="1360" stroke="#333" stroke-width="1"/>
    <text x="530" y="1380" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">Index: 1-4</text>
    <text x="530" y="1400" font-family="Arial" font-size="10" text-anchor="middle" fill="#333">LastTerm: 2</text>
