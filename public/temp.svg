<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1600">
  <!-- 배경 -->
  <rect width="800" height="1600" fill="#f5f5f5"/>
  
  <!-- 제목 -->
  <text x="400" y="40" font-family="Arial" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">Docker Swarm에서의 Raft 합의 알고리즘</text>
  
  <!-- 섹션 1: 리더 선출 -->
  <rect x="50" y="70" width="700" height="450" rx="10" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <text x="90" y="100" font-family="Arial" font-size="20" font-weight="bold" text-anchor="start" fill="#1890ff">1. 리더 선출 (Leader Election)</text>
  
  <!-- 단계 구분선 -->
  <line x1="50" y1="120" x2="750" y2="120" stroke="#1890ff" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="240" x2="750" y2="240" stroke="#1890ff" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="360" x2="750" y2="360" stroke="#1890ff" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- 단계 번호 -->
