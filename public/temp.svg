    <text x="210" y="1145" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 1</text>
    <text x="210" y="1165" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    
    <rect x="340" y="1110" width="120" height="60" rx="10" fill="#fff" stroke="#f5222d" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="340" y1="1110" x2="460" y2="1170" stroke="#f5222d" stroke-width="2"/>
    <line x1="340" y1="1170" x2="460" y2="1110" stroke="#f5222d" stroke-width="2"/>
    <text x="400" y="1145" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 2</text>
    <text x="400" y="1165" font-family="Arial" font-size="12" text-anchor="middle" fill="#f5222d">실패</text>
    
