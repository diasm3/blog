  <text x="70" y="635" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">1</text>
  
  <circle cx="70" cy="770" r="15" fill="#722ed1"/>
  <text x="70" y="775" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="70" cy="900" r="15" fill="#722ed1"/>
  <text x="70" y="905" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">3</text>
  
