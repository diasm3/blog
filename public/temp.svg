    <polygon points="560,295 570,300 560,305" fill="#FA8C16"/>
    <text x="510" y="295" font-family="Arial" font-size="10" text-anchor="middle" fill="#FA8C16">RequestVote</text>
  </g>
  
  <!-- 리더 선출 완료 -->
  <g>
    <text x="400" y="390" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">과반수 투표 획득: Manager 2가 리더(Leader)가 됨</text>
    
    <rect x="150" y="410" width="120" height="60" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
