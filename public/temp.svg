    <text x="400" y="150" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">초기 상태: 모든 노드가 팔로워(Follower)</text>
    
    <rect x="150" y="170" width="120" height="60" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
    <text x="210" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 1</text>
    <text x="210" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    
    <rect x="340" y="170" width="120" height="60" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
    <text x="400" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 2</text>
    <text x="400" y="225" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    
    <rect x="530" y="170" width="120" height="60" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
