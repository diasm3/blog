  <circle cx="70" cy="1200" r="15" fill="#f5222d"/>
  <text x="70" y="1205" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="white">2</text>
  
  <circle cx="70" cy="1320" r="15" fill="#f5222d"/>
