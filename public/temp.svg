    <text x="400" y="1200" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Manager 1이 후보자가 되어 투표 요청 (로그 정보 포함)</text>
    
    <rect x="150" y="1220" width="120" height="60" rx="10" fill="#FFFBE6" stroke="#FA8C16" stroke-width="2"/>
    <text x="210" y="1255" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 1</text>
    <text x="210" y="1275" font-family="Arial" font-size="12" text-anchor="middle" fill="#FA8C16">Candidate</text>
    
    <rect x="530" y="1220" width="120" height="60" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
    <text x="590" y="1255" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 3</text>
    <text x="590" y="1275" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    
