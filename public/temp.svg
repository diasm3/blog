    <polygon points="240,835 230,840 242,845" fill="#52C41A"/>
    <text x="290" y="815" font-family="Arial" font-size="10" text-anchor="middle" fill="#52C41A">AppendEntries</text>
    
    <line x1="450" y1="810" x2="570" y2="840" stroke="#52C41A" stroke-width="2"/>
    <polygon points="560,835 570,840 562,845" fill="#52C41A"/>
    <text x="510" y="815" font-family="Arial" font-size="10" text-anchor="middle" fill="#52C41A">AppendEntries</text>
  </g>
  
