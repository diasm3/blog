    <rect x="530" y="900" width="120" height="65" rx="10" fill="#fff" stroke="#d9d9d9" stroke-width="2"/>
    <text x="590" y="925" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 3</text>
    <text x="590" y="945" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
    <rect x="550" y="950" width="80" height="10" rx="2" fill="#f5222d" stroke="#d9d9d9" stroke-width="1"/>
    <text x="590" y="958" font-family="Arial" font-size="8" text-anchor="middle" fill="white">로그 항목 복제됨</text>
    
