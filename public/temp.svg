    <text x="590" y="1145" font-family="Arial" font-size="14" text-anchor="middle" fill="#333">Manager 3</text>
    <text x="590" y="1165" font-family="Arial" font-size="12" text-anchor="middle" fill="#333">Follower</text>
  </g>
  
  <!-- 새 리더 선출 - 안전성 검사 -->
