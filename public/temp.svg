  <line x1="50" y1="1170" x2="750" y2="1170" stroke="#f5222d" stroke-width="1" stroke-dasharray="5,5"/>
  <line x1="50" y1="1280" x2="750" y2="1280" stroke="#f5222d" stroke-width="1" stroke-dasharray="5,5"/>
