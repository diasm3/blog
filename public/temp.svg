    <text x="400" y="1240" font-family="Arial" font-size="10" text-anchor="middle" fill="#FA8C16">RequestVote (lastLogIndex=4, lastLogTerm=2)</text>
  </g>
  
  <!-- 로그 검사를 통한 리더 제한 -->
  <g>
    <text x="400" y="1310" font-family="Arial" font-size="16" text-anchor="middle" fill="#333">Manager 3는 로그 길이와 텀을 확인 후 투표 승인</text>
    
